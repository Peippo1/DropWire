name: DropWire Pipeline

on:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install -r requirements.txt
      - run: python dropwire.py
        env:
          RAINDROP_TOKEN: ${{ secrets.RAINDROP_TOKEN }}
          TEAMS_RESEARCH_WEBHOOK: ${{ secrets.TEAMS_RESEARCH_WEBHOOK }}
          ...